<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS Waveform Viewer (Select Mode)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f4; }
        #sidebar { width: 320px; background: #fff; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px; z-index: 1000; }
        h2 { margin: 0; font-size: 1.2rem; color: #d32f2f; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; font-weight: bold; color: #666; }
        .utc-text { color: #d32f2f; font-weight: bold; }
        select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; background: white; }
        button { background: #d32f2f; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #b71c1c; }
        #main { flex-grow: 1; display: flex; flex-direction: column; }
        #map { height: 40%; width: 100%; border-bottom: 1px solid #ccc; }
        #viewer { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #fff; padding: 10px; overflow: auto; }
        #waveform-img { max-width: 100%; max-height: 100%; display: none; border: 1px solid #ddd; }
        .msg { color: #888; font-style: italic; font-size: 0.9rem; text-align: center; }
        #status { font-size: 0.75rem; color: #777; margin-top: auto; padding-top: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<aside id="sidebar">
    <h2>IRIS Viewer (UTC)</h2>
    
    <div class="group">
        <label>1. 選擇台網 (Network)</label>
        <select id="net-select">
            <option value="">載入中...</option>
        </select>
    </div>

    <div class="group">
        <label>2. 選擇測站 (Station)</label>
        <select id="sta-select">
            <option value="">請先選擇台網</option>
        </select>
    </div>

    <div class="group">
        <label>位置 (Location)</label>
        <input type="text" id="loc" value="--">
    </div>

    <div class="group">
        <label>頻道 (Channel)</label>
        <input type="text" id="cha" value="BHZ">
    </div>

    <div class="group">
        <label>開始時間 <span class="utc-text">UTC</span></label>
        <input type="datetime-local" id="start" step="1">
    </div>

    <div class="group">
        <label>結束時間 <span class="utc-text">UTC</span></label>
        <input type="datetime-local" id="end" step="1">
    </div>

    <button onclick="doQuery()">送出查詢 (Query)</button>
    
    <div id="status">正在初始化...</div>
</aside>

<main id="main">
    <div id="map"></div>
    <div id="viewer">
        <p id="hint" class="msg">請從選單選擇或點擊地圖測站</p>
        <img id="waveform-img" src="" alt="Waveform Plot">
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([23.5, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);

    // 存儲所有解析後的測站資料
    // 結構: { "TW": ["TPUB", "YULB", ...], "1E": ["MONT1", ... ] }
    let stationMaster = {};

    // --- 初始化 UTC 時間 ---
    function setUTCInputs() {
        const now = new Date();
        const past = new Date(now.getTime() - (60 * 60 * 1000));
        const formatAsUTC = (d) => {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
        };
        document.getElementById('start').value = formatAsUTC(past);
        document.getElementById('end').value = formatAsUTC(now);
    }
    setUTCInputs();

    // --- 載入本機 stations.txt ---
    async function loadStations() {
        const statusEl = document.getElementById('status');
        const netSelect = document.getElementById('net-select');

        try {
            const resp = await fetch('./stations.txt');
            if (!resp.ok) throw new Error('找不到 stations.txt');
            const text = await resp.text();
            const lines = text.split('\n');

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line.startsWith('#')) continue; // 跳過註解和空行

                const cols = line.split('|');
                if (cols.length < 4) continue;
                const [net, sta, lat, lon] = cols;

                // 存入分類結構
                if (!stationMaster[net]) stationMaster[net] = [];
                if (!stationMaster[net].includes(sta)) {
                    stationMaster[net].push(sta);
                }

                // 地圖 Marker
                L.marker([parseFloat(lat), parseFloat(lon)])
                    .addTo(map)
                    .bindPopup(`<b>${net}.${sta}</b>`)
                    .on('click', () => {
                        syncSelects(net, sta);
                    });
            }

            // 填充 Network 下拉選單
            netSelect.innerHTML = '<option value="">-- 請選擇 --</option>';
            Object.keys(stationMaster).sort().forEach(net => {
                const opt = document.createElement('option');
                opt.value = net;
                opt.textContent = net;
                netSelect.appendChild(opt);
            });

            statusEl.innerText = '台站列表載入成功';
        } catch (e) {
            statusEl.innerText = '錯誤: ' + e.message;
        }
    }

    // --- 當 Network 改變時，更新 Station 選單 ---
    document.getElementById('net-select').addEventListener('change', function() {
        const net = this.value;
        const staSelect = document.getElementById('sta-select');
        staSelect.innerHTML = '<option value="">-- 請選擇 --</option>';

        if (net && stationMaster[net]) {
            stationMaster[net].sort().forEach(sta => {
                const opt = document.createElement('option');
                opt.value = sta;
                opt.textContent = sta;
                staSelect.appendChild(opt);
            });
        }
    });

    // --- 地圖點擊後同步兩個下拉選單 ---
    function syncSelects(net, sta) {
        const netSelect = document.getElementById('net-select');
        const staSelect = document.getElementById('sta-select');

        netSelect.value = net;
        // 手動觸發 change 事件來刷新測站選單
        netSelect.dispatchEvent(new Event('change'));
        staSelect.value = sta;
    }

    loadStations();

    // --- 執行查詢 ---
    function doQuery() {
        const net = document.getElementById('net-select').value;
        const sta = document.getElementById('sta-select').value;
        const loc = document.getElementById('loc').value.trim();
        const cha = document.getElementById('cha').value.trim();
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;

        if (!net || !sta) {
            alert('請選擇台網與測站');
            return;
        }

        const img = document.getElementById('waveform-img');
        const hint = document.getElementById('hint');

        hint.innerText = `正在請求波形 (${net}.${sta})...`;
        img.style.display = 'none';

        const url = `https://service.iris.edu/irisws/timeseries/1/query?net=${net}&sta=${sta}&loc=${loc}&cha=${cha}&start=${start}&end=${end}&output=plot`;

        img.src = url;
        img.onload = () => {
            hint.style.display = 'none';
            img.style.display = 'block';
        };
        img.onerror = () => {
            hint.style.display = 'block';
            hint.innerText = '查詢失敗：無資料或參數錯誤。';
        };
    }
</script>

</body>
</html>
